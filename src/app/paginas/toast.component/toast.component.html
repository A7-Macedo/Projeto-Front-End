<div class="toast-container">
  @for (toast of toastService.toasts(); track toast.id) {
    <div class="toast" [class]="toast.type" (click)="toastService.remove(toast.id)">
      <span class="icon">
        @switch (toast.type) {
          @case ('success') { ✔ }
          @case ('error') { ✖ }
          @case ('warning') { ⚠ }
          @default { ℹ }
        }
      </span>
      <span class="message">{{ toast.message }}</span>
    </div>
  }
</div>
