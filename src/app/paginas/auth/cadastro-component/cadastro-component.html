<div class="cadastro-pagina">
    <div class="cadastro-topo">
        <a href="../../index.html" class="cabecalho"></a>
    </div>
    

    <div class="pag-principal-total">

    

        <div class="cadastro-form-card">
            <h1 class="cadastro-titulo">Crie sua conta</h1>

            <form class="cadastro-form" [formGroup]="cadastroForm" (ngSubmit)="onSubmit()">

                
                    <div class="campo-grupo">
                        <label class="campo-label" for="nome">Nome</label>
                          <input class="campo-input" formControlName="name" type="text" id="nome" placeholder="Nome" required />
                    </div>

                    <div class="campo-grupo">
                        <label class="campo-label" for="Sobrenome">Sobrenome</label>
                        <input class="campo-input" formControlName="sobrenome" type="text" id="sobrenome"placeholder="Sobrenome" required />
                    </div>
                

                <div class="campo-grupo">
                    <label class="campo-label">E-mail</label>
                    <input class="campo-input" formControlName="email" type="email" id="email" placeholder="seu@email.com" required />
                </div>

                <div class="campo-grupo">
                      <label class="campo-label" for="senha">Senha</label>
                   <input class="campo-input" formControlName="password" type="password" id="senha" placeholder="Mínimo 8 caracteres" required />
                </div>

                <div class="campo-grupo">
                    <label>Confirmar senha</label>
                    <input type="password" placeholder="Repita a senha">
                </div>

                <div class="cadastro-termos">
                    <input type="checkbox" id="termos" required />
                    <label for="termos">
                        Eu concordo com os Termos de Uso e Política de Privacidade.
                    </label>
                </div>

                <button class="btn-primario">
                    Criar minha conta
                </button>

                <p class="cadastro-login-link">
                Já tem uma conta?
                <a routerLink="/login">Entrar</a>
                </p>
            </form>
        </div>

    </div>
</div>
