<div class="pagina-cadastro">
  <div class="form-roupa">

    <h1>Editar Roupa</h1>

    <!-- Barra de pesquisa -->
    <label>
      <span>Buscar por ID</span>
      <div class="busca-container">
        <input
          type="text"
          placeholder="Ex: 12"
          [formControl]="buscaId"
          (keyup.enter)="buscarRoupa()"
        />
        <button type="button" (click)="buscarRoupa()" [disabled]="buscando()">
          {{ buscando() ? "Buscando..." : "Buscar" }}
        </button>
      </div>
      @if (erroBusca()) {
        <span class="erro">{{ erroBusca() }}</span>
      }
    </label>

    <!-- Formulário só aparece depois que a roupa é encontrada -->
    @if (roupaEncontrada()) {
      <form [formGroup]="roupasForm" (ngSubmit)="onSubmit()">

        <label>
          <span>Nome da Roupa</span>
          <input type="text" formControlName="name" required />
        </label>

        <label>
          <span>Descrição</span>
          <input type="text" formControlName="description" required />
        </label>

        <label>
          <span>Preço</span>
          <input type="number" formControlName="price" required />
        </label>

        <label>
          <span>Categoria</span>
          <select formControlName="categoryId" required>
            <option value="" disabled>Selecione uma categoria</option>
            @for (item of categories(); track $index) {
              <option [value]="item.id">{{ item.name }}</option>
            }
          </select>
        </label>

        <label class="input-arquivo">
          <span>Imagem da Roupa</span>

          @if (imagemAtualUrl()) {
            <img [src]="imagemAtualUrl()" alt="Imagem atual" class="preview-imagem" />
          }

          <input type="file" accept=".png,.jpg,.jpeg,.webp" (change)="onFileChange($event)" />
          <small>Deixe em branco para manter a imagem atual.</small>
        </label>

        <button type="submit">Atualizar Roupa</button>
      </form>
    }

  </div>
</div>
