<ng-container *ngFor="let cat of categorias; let last = last">

  <div class="container-{{ cat }}" *ngIf="mostrar(cat)">

    <div
      class="slot-{{ slotClass(cat) }}"
      *ngFor="let produto of produtosPorCategoriaFiltrado(cat)"
      [routerLink]="['/produto', produto.id]"
      style="cursor: pointer;">

      <img [src]="produto.imagem" [alt]="produto.titulo" class="roupas">
      <p class="titulo">{{ produto.titulo }}</p>
      <p class="descricao">{{ produto.descricao }}</p>
      <div class="produto-footer">
        <p class="preco">R$ {{ (produto.preco || 0).toFixed(2).replace('.', ',') }}</p>
        <button
          class="btn-add-carrinho"
          aria-label="Adicionar ao carrinho"
          (click)="$event.stopPropagation(); adicionarAoCarrinho(produto.id, produto.titulo, produto.preco, produto.imagem)">
          <span>+</span>
        </button>
      </div>
    </div>

  </div>

  <!-- Ver mais dessa categoria: leva o usuário pra visão filtrada só dessa categoria -->
  <button
    class="btn-ver-mais"
    *ngIf="mostrar(cat) && temMaisProdutos(cat)"
    (click)="irParaCategoria(cat)">
    Ver mais ▼
  </button>

  <!-- Linha separando uma categoria da outra: só na visão "todos" (senão fica só 1
       categoria na tela e não há sentido em linha) e nunca depois da última categoria -->
  <hr class="separador-categoria" *ngIf="filtro === 'todos' && !last">

</ng-container>

<p class="sem-resultados" *ngIf="nenhumProdutoEncontrado()">
  Nenhum produto encontrado.
</p>
